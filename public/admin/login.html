<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - DV Classroom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
        (() => {
            const savedTheme = localStorage.getItem('icms-admin-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #ffffff;
            --surface: #ffffff;
            --surface-muted: #fafafa;
            --border: #e8e8e8;
            --text: #000000;
            --text-muted: #5f6775;
            --heading: #000000;
            --primary: #e05322;
            --primary-soft: rgba(224, 83, 34, 0.08);
            --danger: #df514c;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.09);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
            --overlay: rgba(0, 0, 0, 0.04);
            --radius: 4px;
        }

        html[data-theme="dark"] {
            --bg: #161922;
            --surface: #191c24;
            --surface-muted: #212431;
            --border: #2d323f;
            --text: #cbd5e1;
            --text-muted: #8e9db0;
            --heading: #ffffff;
            --primary: #f05a28;
            --primary-soft: rgba(240, 90, 40, 0.1);
            --danger: #ff5722;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 12px 36px rgba(0, 0, 0, 0.45);
            --overlay: rgba(255, 255, 255, 0.02);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background:
                radial-gradient(circle at top left, var(--overlay), transparent 40%),
                linear-gradient(180deg, var(--bg), var(--bg));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text);
            position: relative;
        }

        .login-container {
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-md);
            width: 100%;
            max-width: 400px;
            padding: 40px;
            animation: slideUp 0.3s ease;
        }

        .login-topbar {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10;
        }

        .theme-toggle {
            border: 0;
            background: transparent;
            padding: 0;
        }

        .theme-row {
            display: inline-flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--surface);
            color: var(--text);
            font: inherit;
            cursor: pointer;
            text-align: left;
            transition: border-color 0.2s ease, background-color 0.2s ease, color 0.2s ease;
        }

        .theme-row:hover,
        .theme-row:focus-visible {
            border-color: var(--primary);
            background: var(--primary-soft);
            outline: none;
        }

        .theme-row-label {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .theme-row-label strong {
            font-size: 15px;
            color: var(--heading);
        }

        .theme-row-label small {
            font-size: 12px;
            color: var(--text-muted);
        }

        .theme-switch {
            width: 58px;
            height: 32px;
            flex: 0 0 58px;
            border-radius: 999px;
            background: var(--border);
            position: relative;
            display: inline-flex;
            align-items: center;
            padding: 4px;
        }

        .theme-switch-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--surface);
            box-shadow: var(--shadow-sm);
            transform: translateX(0);
            transition: transform 0.2s ease;
        }

        html[data-theme="dark"] .theme-switch-thumb {
            transform: translateX(26px);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-logo {
            margin-bottom: 20px;
        }

        .login-logo img {
            max-width: 80px;
            height: auto;
        }

        .icms-logo-wrap {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 6px;
          user-select: none;
        }
        .icms-text-wrap {
          position: relative;
          overflow: hidden;
          border-radius: 4px;
          padding: 0 2px;
        }
        .icms-text-wrap::after {
          content: '';
          position: absolute;
          top: 0; left: 0;
          height: 100%; width: 36%;
          background: linear-gradient(108deg, transparent 20%, rgba(255,255,255,0.24) 50%, transparent 80%);
          pointer-events: none;
                    display: none;
        }
        .icms-logo-text {
          display: block;
          font-family: 'Orbitron', sans-serif;
          font-size: 2.2rem;
          font-weight: 900;
          letter-spacing: 0.2em;
                    background: linear-gradient(135deg, #ff7a18 0%, #f97316 36%, #1d4ed8 100%);
                    -webkit-background-clip: text;
                    background-clip: text;
                    color: transparent;
                    -webkit-text-fill-color: transparent;
          line-height: 1.1;
        }
        .icms-dv-badge {
          display: flex;
          align-items: center;
          gap: 6px;
          opacity: 0.65;
          margin-top: 4px;
        }
        .icms-dv-by {
          font-family: 'Plus Jakarta Sans', sans-serif;
          font-size: 0.65rem;
          font-weight: 600;
          letter-spacing: 0.08em;
          color: var(--text-muted);
        }
        .icms-dv-img {
          width: 64px;
          height: auto;
          display: block;
          filter: none;
        }

        .login-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--heading);
            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 14px;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            background: var(--bg);
            color: var(--text);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(224, 83, 34, 0.15);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .submit-btn {
            width: 100%;
            padding: 12px 20px;
            background: var(--primary);
            color: white;
            border: 1px solid transparent;
            border-radius: var(--radius);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: #d54b1d;
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn.loading {
            opacity: 0.8;
            pointer-events: none;
        }

        .loader {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error-message {
            background: rgba(223, 81, 76, 0.08);
            border: 1px solid rgba(223, 81, 76, 0.18);
            color: var(--danger);
            padding: 12px;
            border-radius: var(--radius);
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-muted);
        }

        .login-footer a {
            color: var(--primary);
            text-decoration: none;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .login-container {
                padding: 30px;
            }

            .login-title {
                font-size: 20px;
            }

            .submit-btn {
                padding: 10px 16px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-topbar">
            <button type="button" class="theme-toggle theme-row" id="themeToggle" aria-label="Toggle theme">
                <span class="theme-switch" aria-hidden="true">
                    <span class="theme-switch-thumb"></span>
                </span>
                <span class="theme-row-label">
                    <strong id="themeToggleLabel">Dark</strong>
                    <small>Switch theme</small>
                </span>
            </button>
        </div>
        <div class="login-header">
            <div class="login-logo">
                <div class="icms-logo-wrap">
                    <div class="icms-text-wrap">
                        <span class="icms-logo-text">i-CMS</span>
                    </div>
                    <div class="icms-dv-badge">
                        <span class="icms-dv-by">by</span>
                        <img src="/Logos/DV-Logo.png" alt="DV Analytics" class="icms-dv-img" />
                    </div>
                </div>
            </div>
            <h1 class="login-title">Admin Dashboard</h1>
            <p class="login-subtitle">Manage classroom sessions</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    class="form-input"
                    placeholder="Enter your username"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    class="form-input"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <span id="submitText">Login</span>
            </button>
        </form>

        <div class="login-footer">
            <p>Secure admin access to manage classroom sessions</p>
        </div>
    </div>

    <script>
        const API_BASE_URL = '/api/admin';
        const THEME_STORAGE_KEY = 'icms-admin-theme';

        function applyTheme(theme) {
            const nextTheme = theme === 'light' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', nextTheme);
            localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
            const label = document.getElementById('themeToggleLabel');
            if (label) {
                label.textContent = nextTheme === 'dark' ? 'Dark' : 'Light';
            }
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
            applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
        }

        /**
         * Handle admin login
         */
        async function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const submitBtn = document.getElementById('submitBtn');
            const submitText = document.getElementById('submitText');

            // Clear previous error
            errorMessage.classList.remove('show');
            errorMessage.textContent = '';

            // Validation
            if (!username || !password) {
                showError('Username and password are required');
                return;
            }

            // Disable submit button
            submitBtn.disabled = true;
            submitBtn.classList.add('loading');
            submitText.innerHTML = '<span class="loader"></span>';

            try {
                const response = await fetch(`${API_BASE_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Login failed');
                }

                // Store token in localStorage
                localStorage.setItem('adminToken', data.token);
                localStorage.setItem('adminUsername', username);

                // Redirect to dashboard
                window.location.href = '/admin/dashboard';

            } catch (error) {
                console.error('Login error:', error);
                showError(error.message || 'An error occurred during login');
            } finally {
                // Re-enable submit button
                submitBtn.disabled = false;
                submitBtn.classList.remove('loading');
                submitText.textContent = 'Login';
            }
        }

        /**
         * Show error message
         */
        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }

        applyTheme(document.documentElement.getAttribute('data-theme'));
        document.getElementById('themeToggle')?.addEventListener('click', toggleTheme);

        async function resumeExistingSession() {
            const token = localStorage.getItem('adminToken');
            if (!token) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/validate`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    window.location.href = '/admin/dashboard';
                    return;
                }
            } catch (error) {
                console.warn('Unable to validate existing admin session:', error);
            }

            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminUsername');
        }

        resumeExistingSession();
    </script>
</body>
</html>
